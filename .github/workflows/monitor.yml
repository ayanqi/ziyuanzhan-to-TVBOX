name: Monitor & Deploy

on:
  schedule:
    # Run every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor.py'
      - 'convert.py'
      - 'requirements.txt'
      - 'docs/data/sources.json'
      - '.github/workflows/monitor.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-deploy
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor script
        run: python monitor.py

      - name: Convert online.json to TVBox
        run: python convert.py

      - name: Clean old history files
        run: |
          cd docs/data
          ls -t monitor_*.json 2>/dev/null | tail -n +6 | xargs -r rm -f

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "Update monitor data and TVBox config: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
